<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ប្រព័ន្ធទិន្នន័យសិស្ស</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: { colors: { brand: '#2f5d46' }, fontFamily: { sans: ['"Noto Sans Khmer"', 'system-ui', 'sans-serif'] } } } }
</script>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-900 text-[15px]">
<div id="app"></div>
<script src="app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#1E3A8A',
          accent: '#DC2626'
        }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans Khmer', sans-serif; }
  @media (max-width: 768px) {
    .responsive-table thead { display: none; }
    .responsive-table tr { 
      display: block; margin-bottom: 12px; border: 1px solid #e5e7eb; 
      border-radius: 8px; background: white; padding: 8px;
    }
    .responsive-table td { 
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; border: none; border-bottom: 1px solid #f3f4f6;
    }
    .responsive-table td:last-child { border-bottom: none; }
    .responsive-table td::before { 
      content: attr(data-label); font-weight: 600; 
      color: #1E3A8A; font-size: 0.85rem;
    }
  }
</style>
</body>
</html>
