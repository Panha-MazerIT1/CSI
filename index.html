<style>
  body { font-family: 'Noto Sans Khmer', sans-serif; }
  @media (max-width: 768px) {
    .responsive-table thead { display: none; }
    .responsive-table tr {
      display: block; margin-bottom: 12px; border: 1px solid #e5e7eb;
      border-radius: 8px; background: white; padding: 8px;
    }
    .responsive-table td {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 8px; border: none; border-bottom: 1px solid #f3f4f6;
    }
    .responsive-table td:last-child { border-bottom: none; }
    .responsive-table td::before {
      content: attr(data-label); font-weight: 600;
      color: #1E3A8A; font-size: 0.85rem;
    }
  }
</style>

<body class="bg-stone-50 text-stone-900 text-[15px]">
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
<script src="photo-tools.js"></script>
<script src="qr-login.js"></script>
<script src="roster.js"></script>
<script>init();</script>
<script>
  // PWA: ចុះឈ្មោះ Service Worker (ដំណើរការលើ HTTPS ឬ localhost/127.0.0.1 ប៉ុណ្ណោះ)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
  }
  // ប៊ូតុង "ដំឡើងអាប់" (Chrome/Edge/Brave/Android)
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    if (document.getElementById('pwaInstall')) return;
    const b = document.createElement('button');
    b.id = 'pwaInstall';
    b.textContent = '⬇ ដំឡើងអាប់';
    b.className = 'fixed bottom-4 right-4 z-40 bg-brand text-white rounded-full px-5 py-3 text-sm font-semibold shadow-lg hover:brightness-110 active:scale-95 transition';
    b.onclick = async () => { b.remove(); deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; };
    document.body.appendChild(b);
  });
  window.addEventListener('appinstalled', () => document.getElementById('pwaInstall')?.remove());
</script>
</body>
